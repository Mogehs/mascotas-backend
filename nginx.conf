# Production Nginx config for Mascotas Backend
# Place in: /etc/nginx/sites-available/mascotas-backend
# Enable: sudo ln -s /etc/nginx/sites-available/mascotas-backend /etc/nginx/sites-enabled/

upstream mascotas_backend {
    server localhost:5001;
    keepalive 64;
}

# -----------------------
# HTTP Server (port 80) - Certbot will redirect to HTTPS automatically
# -----------------------
server {
    listen 80;
    listen [::]:80;

    server_name identificapetadmin.eu www.identificapetadmin.eu;

    # Redirect all traffic to HTTPS (Certbot will handle this)
    location / {
        proxy_pass http://mascotas_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://mascotas_backend;
    }
}

# -----------------------
# HTTPS Server (443) - CERTBOT will insert SSL lines automatically
# -----------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name identificapetadmin.eu www.identificapetadmin.eu;

    # Certbot will add:
    # ssl_certificate /etc/letsencrypt/live/identificapetadmin.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/identificapetadmin.eu/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/mascotas-backend-access.log;
    error_log /var/log/nginx/mascotas-backend-error.log;

    # Client body size (for file uploads)
    client_max_body_size 50M;

    # Main location proxy to Node.js backend
    location / {
        proxy_pass http://mascotas_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io / WebSocket support
    location /socket.io/ {
        proxy_pass http://mascotas_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Static file uploads
    location /uploads/ {
        alias /var/www/mascotas-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        proxy_pass http://mascotas_backend;
    }

    # Deny hidden files (like .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
